# Release of a SuiteCRM project, called by the project on every push to main:
#   jobs:
#     release:
#       permissions: { contents: write, pull-requests: write, packages: write }
#       uses: david-grosskost/suitecrm-devkit/.github/workflows/release.yml@vX.Y.Z
#       secrets: inherit
#
# 1. release-please keeps a "release" pull request up to date: next version,
#    computed from the Conventional Commits, and CHANGELOG.md. Merging it
#    creates the tag and the GitHub release.
# 2. When a release has just been created, the image is built, scanned for
#    known vulnerabilities (make security@image), then pushed to GHCR, tagged
#    with the version. Done here and not on the tag event: a tag
#    created with GITHUB_TOKEN does not trigger other workflows.
#
# Outputs release_created and version: the project can chain its demo
# deployment (deploy.yml), which then starts once the image is pushed.
#
# Optional secret RELEASE_TOKEN (personal access token): without it,
# release pull requests are opened with GITHUB_TOKEN and do not trigger the CI.
name: Release

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile of the image, empty for a project without image
        type: string
        default: .docker/Dockerfile
      target:
        description: Build stage of the image
        type: string
        default: base
    secrets:
      RELEASE_TOKEN:
        required: false
    # For the jobs that follow in the project, e.g. the demo deployment.
    outputs:
      release_created:
        description: "true when this run created a release (and pushed its image)"
        value: ${{ jobs.release-please.outputs.release_created }}
      version:
        description: Version of the created release, e.g. 0.2.0
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && inputs.dockerfile != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Built into the local Docker first: scanned before anything is published.
      - name: Build ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          load: true
          # Layers cached between releases (GitHub Actions cache): only the
          # steps after a change are rebuilt, not the PHP extensions each time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install the devkit
        run: make

      # Fails on a critical, fixable vulnerability of the system packages:
      # the image is then not published, and the demo not deployed.
      - name: Scan the image (Trivy)
        run: make security@image IMAGE="ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}"

      - name: Push the image
        run: docker push "ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}"
