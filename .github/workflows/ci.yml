# CI of the devkit itself: the same checks as every project.
# Pull requests only: main only receives merged pull requests whose checks
# passed, so running them again on each push would be redundant.
name: CI

on:
  pull_request:
    # edited: a corrected pull request title is checked again.
    types: [opened, synchronize, reopened, edited]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
